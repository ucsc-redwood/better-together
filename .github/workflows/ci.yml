name: CI

# What runs on GitHub-hosted runners: formatting, the OMP-as-oracle unit tests
# (the everyday gate), and the optimizer pytest. The CUDA / Vulkan / Android
# targets need the physical fleet (Jetson, iGPU box, phones) and are verified
# out-of-band via the run-on-*.sh scripts / `just test` — they cannot run here.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format (fmt-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2
      - uses: oven-sh/setup-bun@v2
      - name: Install shfmt
        run: |
          sudo curl -fsSL \
            https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64 \
            -o /usr/local/bin/shfmt
          sudo chmod +x /usr/local/bin/shfmt
      - name: Install pinned formatters (clang-format, ruff, gersemi)
        run: uv sync --group dev
      - name: just fmt-check
        run: just fmt-check

  test-omp:
    name: build + ctest -L omp
    runs-on: ubuntu-latest
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v4
      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/**', '**/CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Configure (pc preset — OpenMP only)
        run: cmake --preset pc
      - name: Build
        run: cmake --build --preset pc
      - name: Test (OMP-as-oracle differential)
        # The pipeline-e2e tests pin worker threads to physical core IDs from the
        # 'pc' device profile (24 cores: 8 big + 16 little). Hosted runners have ~4
        # cores, so they abort with "Failed to pin thread to cores". Those run on
        # the real fleet via `just test`. CI covers the topology-independent set:
        # the per-stage differential oracle (tree / cifar-dense / cifar-sparse),
        # the schedule contract, the guards, and device validation.
        run: |
          echo "NOTE: excluding pipeline-e2e (needs >=9-core topology; fleet-only)"
          ctest --test-dir build/pc -L omp -E 'pipeline-e2e' --output-on-failure

  optimizer:
    name: optimizer pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Test
        working-directory: optimizer
        run: |
          uv sync --extra test
          uv run pytest -q

  sanitizers:
    # Build the OMP surface with AddressSanitizer+UBSan / ThreadSanitizer and run the
    # same topology-independent oracle subset as test-omp. ASan/UBSan catch heap and UB
    # bugs the optimised build hides; TSan catches data races. asan uses the default
    # toolchain (gcc). tsan MUST use clang + LLVM libomp + the Archer OMPT tool:
    # gcc/libgomp is not TSan-instrumented, so the implicit barrier ending every
    # parallel region is invisible and each AppData destructor after an OMP kernel
    # reported a bogus race (the perpetually-red tsan job). Archer restores the
    # OpenMP happens-before; .github/tsan-suppressions.txt silences libomp's own
    # uninstrumented internals only. pipeline-e2e is excluded for the same reason as
    # test-omp (pins to physical cores absent on hosted runners) — TSan's prime target,
    # the concurrent ring, runs on the fleet via `just tsan` (same recipe).
    name: ${{ matrix.san }} (build + ctest -L omp)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        san: [asan, tsan]
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
      ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/**', '**/CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: TSan toolchain — clang + libomp + Archer (libgomp is not TSan-instrumented)
        if: matrix.san == 'tsan'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q clang libomp-dev
          echo "CC=clang"    >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          archer=$(find /usr/lib -name 'libarcher.so*' 2>/dev/null | head -1)
          [ -n "$archer" ] || { echo "libarcher.so not found (needed for OMP happens-before under TSan)"; exit 1; }
          echo "OMP_TOOL_LIBRARIES=$archer" >> "$GITHUB_ENV"
          echo "TSAN_OPTIONS=halt_on_error=1:suppressions=$GITHUB_WORKSPACE/.github/tsan-suppressions.txt" >> "$GITHUB_ENV"
      - name: Configure (pc-${{ matrix.san }} preset)
        run: cmake --preset pc-${{ matrix.san }}
      - name: Build
        run: cmake --build --preset pc-${{ matrix.san }}
      - name: Test (OMP-as-oracle differential, under ${{ matrix.san }})
        run: ctest --test-dir build/pc-${{ matrix.san }} -L omp -E 'pipeline-e2e' --output-on-failure

  clang-tidy:
    # Static analysis (.clang-tidy) scoped to the lines changed in the PR, so the
    # curated checks gate NEW code without the legacy tree's findings walling the gate.
    # Configure-only: pc needs no build (the codegen headers are committed), just the
    # compile_commands.json that `cmake --preset pc` writes.
    name: clang-tidy (changed lines)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the PR base commit to diff against
      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/**', '**/CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: Configure (writes compile_commands.json)
        run: cmake --preset pc
      - name: Fetch clang-tidy-diff helper
        run: |
          curl -fsSL -o clang-tidy-diff.py \
            https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-18.1.8/clang-tools-extra/clang-tidy/tool/clang-tidy-diff.py
      - name: Lint changed lines
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          out=$(git diff -U0 "$base" -- '*.cpp' '*.hpp' '*.cu' '*.cuh' \
            | python3 clang-tidy-diff.py -p1 -path build/pc -j"$(nproc)" 2>&1) || true
          echo "$out"
          # Fail only on first-party clang-tidy CHECK findings on changed lines.
          # Ignore clang-diagnostic-* : a Vulkan/CUDA TU isn't built under the pc
          # preset, so clang-tidy reports its backend headers as "file not found".
          # That's the known hosted-coverage gap (the fleet build / `just tidy` lints
          # those), not a code issue, and must not wall the gate.
          findings=$(echo "$out" | grep -E ': (warning|error): ' | grep -vE '\[clang-diagnostic-' || true)
          if [ -n "$findings" ]; then
            echo "::error::clang-tidy reported issues on changed lines (see log above)"
            exit 1
          fi
          echo "clang-tidy: no first-party findings on changed lines."
