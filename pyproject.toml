[project]
name = "better-together"
version = "0.1.0"
description = "Profile-guided software pipelining for heterogeneous edge SoCs"
readme = "README.md"
requires-python = ">=3.13"
# The Python side of the repo is one uv workspace (members below) resolved into a
# single uv.lock. The only runtime dependency is the bt-optimizer member: it owns
# the analysis/orchestration stack (z3, jsonschema, numpy, rich, + the plot extra
# matplotlib/pandas), so the dashboard and the fleet orchestrator -- which import
# `smt`/`orchestrate` -- run from this one venv via `uv run`. The duplicated root
# copies of those deps (and an unused seaborn) were removed; they live in
# optimizer/pyproject.toml, their true owner.
dependencies = ["bt-optimizer[plot]"]

[tool.uv.workspace]
members = ["optimizer"]

[tool.uv.sources]
bt-optimizer = { workspace = true }

# Code-formatting toolchain (run via `just fmt` / `just fmt-check`). The
# pip-installable formatters live here so uv.lock pins exact versions — in
# particular clang-format, whose output drifts across releases. shfmt (Go) and
# prettier (run via bunx, for JSON) are not pip packages; see the justfile.
[dependency-groups]
dev = [
    "ruff>=0.15",
    "gersemi>=0.27",
    "clang-format>=20",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "build",
    ".venv-cifar",
    "**/_deps",
    "optimizer/bt_optimizer.egg-info",
    # Generated code — codegen re-emits it unformatted at build time.
    "**/generated/**",
    "optimizer/smt/bt_vocab.py",
    # Untracked standalone analysis site (separate codebase, not the main project).
    "dashboard",
]

[tool.ruff.lint]
# Formatting-only: just import sorting (I), which is fully autofixable, so
# `ruff format` + `ruff check --fix` leaves no residual findings. The formatter
# owns everything else. Broaden `select` (e.g. "E", "F") later for real linting.
select = ["I"]

[tool.gersemi]
line_length = 100
